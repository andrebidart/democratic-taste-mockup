document.body.appendChild(renderer.domElement);

camera.position.copy(CAM_START);

controls.target.copy(TARGET); controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 14; controls.maxDistance = 45; controls.maxPolarAngle = Math.PI*0.47;
controls.enabled = false;

const easeInOut = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;

/* ---------- the machine (logo, rebuilt) ---------- */
const machine = new THREE.Group(); machine.position.set(-4,0,0); scene.add(machine);
const body = mesh(rbox(5,3.5,4,0.55), mat(PAL.lilac), machine); body.position.y = 2.25;
for (const [x,z] of [[-2,-1.5],[2,-1.5],[-2,1.5],[2,1.5]]) { const f=mesh(new THREE.CylinderGeometry(.28,.34,.5,20), mat(PAL.ink,.6), machine); f.position.set(x,.25,z); }

// keyboard on the front

  const k = mesh(rbox(.42,.85,.34,.1), mat(PAL.white,.4), machine);

for (let i=0;i<22;i++){

// cooking pot + steam

const woofer = new THREE.Group(); woofer.position.set(0,1.3,1.31); spk.add(woofer);

const rollers=[];
for (const x of [BELT_X0, BELT_X1]) { const r=mesh(new THREE.CylinderGeometry(.42,.42,2.6,28), mat(PAL.sky,.45)); r.rotation.x=Math.PI/2; r.position.set(x,1.1,0); rollers.push(r); }
for (const x of [0.2, 4.0, 7.8]) for (const z of [-.95,.95]) { const l=mesh(new THREE.CylinderGeometry(.13,.13,1,16), mat(PAL.sky,.45)); l.position.set(x,.5,z); }

// candy jar at the end
const jar = new THREE.Group(); jar.position.set(10.45,0,0); scene.add(jar);
mesh(new THREE.CylinderGeometry(1.05,1.05,.12,40), mat(PAL.white,.3), jar).position.y=.06;
const glass = new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.05,1.35,40,1,true),
  new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.08,transparent:true,opacity:.22,depthWrite:false,side:THREE.DoubleSide,clearcoat:1}));
glass.position.y=.68; jar.add(glass);
mesh(new THREE.TorusGeometry(1.15,.07,12,48), mat(PAL.white,.3), jar).rotation.x=Math.PI/2; jar.children[2].position.y=1.35;

// floating clay bits (from your refs)
const floaters = [];
[[ -9.5,6.2,-3, new THREE.SphereGeometry(.75,32,16), PAL.orange],
 [  2.5,6.8,-2.5, new THREE.SphereGeometry(.3,24,12), PAL.hot],
 [  9.0,5.6,-3.5, new THREE.TorusGeometry(.5,.22,16,32), PAL.lilac],
 [ -6.0,6.8, 2.5, new THREE.SphereGeometry(.22,24,12), PAL.mint],
 [ 12.5,3.8, 1.5, rbox(.6,.6,.6,.2), PAL.yellow]].forEach(([x,y,z,g,c],i)=>{
  const m=mesh(g,mat(c,.5)); m.position.set(x,y,z); m.userData.y0=y; m.userData.ph=i*1.7; floaters.push(m); });

/* ---------- the Control Me kid (3D) ---------- */
const KID = { skin:0xffe2cc, hair:0x1b1720, suit:0x26232d, suit2:0x37323f, pants:0xb89f7a, pants2:0x9c8462, tote:0xf3e3c3 };
const kid = new THREE.Group(); kid.position.set(4.7,0,-1.85); kid.rotation.y = .42; kid.scale.setScalar(1.08); scene.add(kid);
const kidBody = new THREE.Group(); kid.add(kidBody);
// bare feet + baggy pants
for (const s of [-1,1]) {
  const foot = new THREE.Group(); foot.position.set(s*.28,.12,.1); kidBody.add(foot);
  mesh(new THREE.CapsuleGeometry(.14,.26,6,12), mat(KID.skin,.6), foot).rotation.x = Math.PI/2;

  mesh(new THREE.CylinderGeometry(.22,.29,.9,16), mat(KID.pants,.8), kidBody).position.set(s*.28,.82,0);

}

const dtc = document.createElement('canvas'); dtc.width = dtc.height = 128; const dx = dtc.getContext('2d');
dx.fillStyle='#2a2233'; dx.beginPath(); dx.arc(64,64,60,0,Math.PI*2); dx.fill();

dx2.fillStyle='#ff86bd'; dx2.beginPath(); dx2.arc(64,64,60,0,Math.PI*2); dx2.fill();
dx2.fillStyle='#26232d'; dx2.font='700 62px Fredoka, sans-serif'; dx2.textAlign='center'; dx2.textBaseline='middle'; dx2.fillText('DT',64,68);
const dtTex2 = new THREE.CanvasTexture(dtc2); dtTex2.colorSpace = THREE.SRGBColorSpace;
const chest = new THREE.Mesh(new THREE.CircleGeometry(.17,24), new THREE.MeshStandardMaterial({map:dtTex2,roughness:.6}));

grin.position.set(0,-.24,.625); grin.rotation.x = -.2; grin.visible = false; head.add(grin);
// manga symbols (sprites)
function symTex(draw){ const c=document.createElement('canvas'); c.width=c.height=128; draw(c.getContext('2d')); const tx=new THREE.CanvasTexture(c); tx.colorSpace=THREE.SRGBColorSpace; return tx; }
const heartTex = symTex(x=>{ x.fillStyle='#ff4f8b'; x.strokeStyle='#2a2233'; x.lineWidth=8; x.beginPath(); x.moveTo(64,110);
  x.bezierCurveTo(8,70,14,20,44,20); x.bezierCurveTo(56,20,64,30,64,40); x.bezierCurveTo(64,30,72,20,84,20); x.bezierCurveTo(114,20,120,70,64,110); x.closePath(); x.fill(); x.stroke(); });
const zzzTex = symTex(x=>{ x.fillStyle='#5b6bd6'; x.font='700 40px Fredoka, sans-serif'; x.fillText('z',10,112); x.font='700 54px Fredoka, sans-serif'; x.fillText('z',40,80); x.font='700 68px Fredoka, sans-serif'; x.fillText('Z',72,54); });
const angerTex = symTex(x=>{ x.strokeStyle='#ff3b5c'; x.lineWidth=15; x.lineCap='round';
  for (let i=0;i<4;i++){ x.save(); x.translate(64,64); x.rotate(i*Math.PI/2); x.beginPath(); x.moveTo(14,-44); x.quadraticCurveTo(14,-14,44,-14); x.stroke(); x.restore(); } });
const sparkTex = symTex(x=>{ x.fillStyle='#ffc94d'; x.strokeStyle='#2a2233'; x.lineWidth=6; x.beginPath();
  for (let i=0;i<8;i++){ const a=i*Math.PI/4, r=i%2?16:56; x.lineTo(64+Math.cos(a)*r, 64+Math.sin(a)*r); } x.closePath(); x.fill(); x.stroke(); });
const spr = (tex, sc) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false })); s.scale.setScalar(sc); s.visible=false; head.add(s); return s; };
const heartL = spr(heartTex,.36), heartR = spr(heartTex,.36); heartL.position.set(-.23,.06,.7); heartR.position.set(.23,.06,.7);
const zzz = spr(zzzTex,.75); zzz.position.set(.7,.75,.2);
const anger = spr(angerTex,.45); anger.position.set(.55,.62,.35);
const spark = spr(sparkTex,.4); spark.position.set(-.6,.7,.3);

/* ---------- candies ---------- */
const HIT_GEO = new THREE.SphereGeometry(.85,10,8), HIT_MAT = new THREE.MeshBasicMaterial({ visible:false });
const candies = []; const pile = [];
function makeCandy(idx){
  const [cat,title,artist] = RELEASES[idx % RELEASES.length];
  const color = CANDY_COLORS[idx % CANDY_COLORS.length], shape = SHAPES[idx % SHAPES.length];
  const g = new THREE.Group(), inner = new THREE.Group(); g.add(inner);
  const c = new THREE.Color(color), m = mat(c,.32), m2 = mat(c.clone().lerp(new THREE.Color(0xffffff),.4),.45);
  let y0 = .38;
  if (shape==='wrapped'){ mesh(new THREE.SphereGeometry(.36,32,16),m,inner).scale.set(1.3,1,1);
    for (const s of [-1,1]){ const w=mesh(new THREE.ConeGeometry(.27,.36,16),m2,inner); w.rotation.z=s*Math.PI/2; w.position.x=s*.58; } y0=.38; }
  if (shape==='lolly'){ mesh(new THREE.CylinderGeometry(.44,.44,.2,32),m,inner);
    const sw=mesh(new THREE.TorusGeometry(.25,.055,10,28),mat(0xffffff,.4),inner); sw.rotation.x=Math.PI/2; sw.position.y=.1;
    const st=mesh(new THREE.CylinderGeometry(.05,.05,.9,10),mat(0xffffff,.5),inner); st.rotation.z=Math.PI/2; st.position.x=.8; y0=.12; }
  if (shape==='gummy'){ mesh(rbox(.62,.62,.62,.22),m,inner); y0=.33; }
  if (shape==='ring'){ const r=mesh(new THREE.TorusGeometry(.3,.15,16,32),m,inner); r.rotation.x=Math.PI/2;
    const r2=mesh(new THREE.TorusGeometry(.3,.06,10,32),m2,inner); r2.rotation.x=Math.PI/2; r2.position.y=.13; y0=.16; }
  const hit = new THREE.Mesh(HIT_GEO, HIT_MAT); hit.position.y = .1; g.add(hit); g.userData.hit = hit;
  hit.userData.candy = g;
  Object.assign(g.userData, { cat,title,artist,color:'#'+c.getHexString(), url:`https://democratictaste.fanlink.tv/${cat}`,
                 y0, state:'belt', age:0, hover:0, vx:0, vy:0, vz:0, spin:0, land:0 });
  return g;
}
let spawnIdx = 0, squash = 0;
function spawnCandy(){
  const g = makeCandy(spawnIdx++);
  g.position.set(BELT_X0+.2, BELT_TOP+g.userData.y0, (Math.random()-.5)*.5);
  g.rotation.y = (Math.random()-.5)*.6; g.scale.setScalar(.01);
  scene.add(g); candies.push(g); squash = 1;
  drawScreen(`NOW COOKING ▸ ${g.userData.cat} ${g.userData.title}`);
}

/* ---------- interaction ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(9,9), pointer = new THREE.Vector2(0,0);
let hovered = null, lastHovered = null, hoverHold = 0, kidJump = 0; const hitList = [];
let steal = null, nextSteal = 7, angryT = 0, lastMove = 0, dragging = false; const camAtDown = new THREE.Vector3();
controls.addEventListener('start', ()=>{ dragging = true; camAtDown.copy(camera.position); });
controls.addEventListener('change', ()=>{ if (dragging && camera.position.distanceTo(camAtDown) > .6) angryT = 1.6; });
controls.addEventListener('end', ()=>{ dragging = false; });
addEventListener('pointermove', e=>{ ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); pointer.copy(ndc); lastMove = t; });
addEventListener('pointerleave', ()=>ndc.set(9,9));
renderer.domElement.addEventListener('click', ()=>{ if (hovered){ kidJump = 1; window.open(hovered.userData.url,'_blank','noopener'); } });
const tip = document.getElementById('tip');
const tipC = tip.querySelector('.c'), tipT = tip.querySelector('.t'), tipA = tip.querySelector('.a'), tipDot = tip.querySelector('.dot');

/* ---------- loop ---------- */
const BPM = 118; const clock = new THREE.Clock();
let t = 0, lastBeat = -1, beltV = 1.6, puffT = 0;
const tmp = new THREE.Vector3();
function onBeat(b){
  const k = keys[(b*4)%9]; k.userData.press = 1;
  if (b%3===0) keys[(b*7+2)%9].userData.press = 1;
  if (b%2===0 && beltV > 1.2 && t > 1.2) spawnCandy();
}
function tick(){
  const dt = Math.min(clock.getDelta(), .05); t += dt;
  const beat = t*BPM/60, bi = Math.floor(beat), bp = beat-bi;
  if (bi !== lastBeat){ lastBeat = bi; onBeat(bi); }

  // intro camera
  const intro = Math.min(t/3.2,1);
  if (intro < 1) { camera.position.lerpVectors(CAM_START, CAM_END, easeInOut(intro)); camera.lookAt(TARGET); }
  else if (!controls.enabled) { controls.enabled = true; document.querySelectorAll('.ui').forEach(u=>u.classList.add('show')); }
  if (controls.enabled) controls.update();

  // hover
  let found = null;
  if (controls.enabled) {
    ray.setFromCamera(ndc, camera);
    hitList.length = 0;
    for (const c of candies) if (c.userData.state==='belt') hitList.push(c.userData.hit);
    const hit = ray.intersectObjects(hitList, false)[0];
    if (hit) found = hit.object.userData.candy;
  }
  if (found) { hovered = found; hoverHold = .2; }
  else if (hovered) { hoverHold -= dt; if (hoverHold <= 0 || hovered.userData.state!=='belt') hovered = null; }
  if (hovered !== lastHovered) {
    renderer.domElement.style.cursor = hovered ? 'pointer' : '';
    if (hovered) { const u = hovered.userData; tipC.textContent = u.cat; tipT.textContent = u.title; tipA.textContent = u.artist; tipDot.style.background = u.color; }
    tip.classList.toggle('on', !!hovered);
    lastHovered = hovered;
  }
  beltV += ((hovered?0:1.6) - beltV) * Math.min(dt*8,1);
  beltTex.offset.x -= beltV*dt/(BELT_LEN/26);
  rollers.forEach(r=>r.rotation.y -= beltV*dt/.42);

  // candies
  for (let i=candies.length-1;i>=0;i--){
    const g = candies[i], u = g.userData; u.age += dt;
    u.hover += ((g===hovered?1:0) - u.hover) * Math.min(dt*12,1);
    if (u.state==='belt'){
      g.position.x += beltV*dt;
      const pop = easeBack(Math.min(u.age/.55,1));
      g.scale.setScalar(Math.max(.01,pop*(1+.4*u.hover)));
      g.children[0].position.y = .55*u.hover;
      g.children[0].rotation.y += dt*2.5*u.hover;
      if (g.position.x > BELT_X1+.1){ u.state='fall'; u.vx=1.2+Math.random()*1.1; u.vy=1.5; u.vz=(Math.random()-.5)*1.4; u.spin=(Math.random()-.5)*10;
        u.land = .14 + u.y0*.6 + Math.min(pile.length,14)*.035 + Math.random()*.15; }
    } else if (u.state==='fall'){
      u.vy -= 20*dt; g.position.x += u.vx*dt; g.position.y += u.vy*dt; g.position.z += u.vz*dt;
      g.rotation.x += u.spin*dt; g.rotation.z += u.spin*.7*dt;
      const dx = g.position.x-jar.position.x, dz = g.position.z;
      const rr = Math.hypot(dx,dz); if (rr > .8){ g.position.x = jar.position.x+dx/rr*.8; g.position.z = dz/rr*.8; }
      if (g.position.y < u.land){ g.position.y = u.land; u.state='pile'; pile.push(g);
        if (pile.length > 18){ const old = pile.shift(); old.userData.state='gone'; } }
    } else if (u.state==='gone'){
      g.scale.multiplyScalar(1-dt*6);
      if (g.scale.x < .03){ scene.remove(g); candies.splice(i,1); g.traverse(o=>{ if(o.geometry && o.geometry!==HIT_GEO) o.geometry.dispose(); }); }
    }
  }

  // tooltip
  if (hovered){
    tmp.copy(hovered.position); tmp.y += 1.4; tmp.project(camera);
    const x = Math.round((tmp.x+1)/2*innerWidth), y = Math.round((1-tmp.y)/2*innerHeight);
    tip.style.transform = `translate(${x}px,${y}px) translate(-50%,-100%)`;
  }

  // machine: squash on spawn, keys, knobs
  squash = Math.max(0, squash - dt*4);
  const sq = Math.sin(squash*Math.PI)*squash;
  machine.scale.set(1+.035*sq, 1-.06*sq, 1+.035*sq);
  keys.forEach(k=>{ k.userData.press = Math.max(0,k.userData.press-dt*5); k.position.z = k.userData.z0 - .13*k.userData.press; k.position.y = 1.3 - .05*k.userData.press; });
  knobs.forEach((k,i)=>k.rotation.y = Math.sin(t*(.6+i*.35)+i)*1.6);
  const thump = Math.pow(1-bp,4);
  woofer.scale.setScalar(1+.12*thump); tweet.scale.setScalar(1+.08*Math.pow(1-((beat*2)%1),4));
  hop.rotation.y += dt*.3;

  // steam
  puffT += dt;
  if (puffT > .22){ puffT = 0; const p = puffs.find(p=>p.userData.life<0);
    if (p){ p.userData.life = 0; pot.getWorldPosition(p.position); p.position.y += .85; p.position.x += (Math.random()-.5)*.3; p.userData.dx=(Math.random()-.5)*.3; } }
  puffs.forEach(p=>{ const u=p.userData; if (u.life<0) return; u.life += dt/2.4;
    if (u.life>=1){ u.life=-1; p.material.opacity=0; return; }
    p.position.y += dt*1.1; p.position.x += u.dx*dt; p.scale.setScalar(.5+u.life*1.6);
    p.material.opacity = Math.sin(u.life*Math.PI)*.85; });

  // floaters
  floaters.forEach(f=>{ f.position.y = f.userData.y0 + Math.sin(t*1.1+f.userData.ph)*.25; f.rotation.y += dt*.4; f.rotation.x += dt*.2; });

  // the kid: mood = angry > love > sleep > smug
  kidJump = Math.max(0, kidJump - dt*1.6); angryT = Math.max(0, angryT - dt);
  const mood = angryT > 0 ? 'angry' : hovered ? 'love' : (t - lastMove > 9 && !steal) ? 'sleep' : 'smug';
  const k = Math.min(dt*8,1), lerp = (o,key,v)=>{ o[key] += (v - o[key])*k; };
  const bounce = Math.pow(Math.sin(bp*Math.PI),2);
  const amp = mood==='love' ? .22 : mood==='sleep' ? 0 : .07;
  const jump = Math.sin(kidJump*Math.PI)*1.4;
  kidBody.position.y = bounce*amp + jump;
  kidBody.rotation.y = kidJump*Math.PI*2;
  const breathe = mood==='sleep' ? Math.sin(t*1.6)*.02 : 0;
  kidBody.scale.set(1+.03*(1-bounce)*(amp>0)+breathe, 1-.03*(1-bounce)*(amp>0)+breathe, 1);

  // steal a candy now and then
  if (!steal && mood==='smug' && t > nextSteal){
    const reachX = kid.position.x + .5;
    const target = candies.find(c=>c.userData.state==='belt' && Math.abs(c.position.x - reachX) < .5);
    if (target){ steal = { c:target, p:0 }; target.userData.state = 'stolen'; }
  }
  let reach = 0;
  if (steal){
    steal.p += dt/1.7; const p = steal.p, c = steal.c;
    reach = p < .3 ? easeInOut(p/.3) : p < .5 ? 1 : Math.max(0, 1 - easeInOut((p-.5)/.35));
    if (p > .3){
      hands[1].getWorldPosition(tmp);
      if (p < .85) c.position.lerp(tmp, Math.min(1, dt*14));
      else { tote.getWorldPosition(tmp); tmp.y += .3; c.position.lerp(tmp, Math.min(1, dt*10)); c.scale.multiplyScalar(1 - dt*3); }
      c.rotation.y += dt*6;
    }
    spark.visible = p > .5; spark.material.rotation += dt*4; spark.scale.setScalar(.35 + Math.sin(t*12)*.05);
    if (p >= 1){ c.userData.state = 'gone'; tote.scale.setScalar(1.15); steal = null; spark.visible = false; nextSteal = t + 9 + Math.random()*6; }
  }
  tote.scale.lerp(new THREE.Vector3(1,1,1), Math.min(dt*6,1));
  kidBody.rotation.x = .28*reach;

  // arms
  if (mood==='love'){ lerp(arms[1].rotation,'z', 2.3 + Math.sin(t*10)*.25); lerp(arms[-1].rotation,'z', -2.3 - Math.sin(t*10+1)*.25); lerp(arms[1].rotation,'x',0); lerp(arms[-1].rotation,'x',0); }
  else if (mood==='angry'){ lerp(arms[1].rotation,'z',-.9); lerp(arms[-1].rotation,'z',.9); lerp(arms[1].rotation,'x',-1.1); lerp(arms[-1].rotation,'x',-1.0); }
  else if (mood==='sleep'){ lerp(arms[1].rotation,'z',.06); lerp(arms[-1].rotation,'z',-.06); lerp(arms[1].rotation,'x',0); lerp(arms[-1].rotation,'x',0); }
  else { lerp(arms[1].rotation,'z', .14 + .1*reach); lerp(arms[-1].rotation,'z', -.14 - bounce*.08); arms[1].rotation.x = -1.35*reach; lerp(arms[-1].rotation,'x',0); }

  // head
  const lookY = mood==='sleep' ? 0 : THREE.MathUtils.clamp(pointer.x*.9 - .35, -.9, .7);
  const lookX = mood==='sleep' ? .35 : THREE.MathUtils.clamp(-pointer.y*.35, -.3, .3) + .25*reach;
  lerp(head.rotation,'y', lookY); lerp(head.rotation,'x', lookX);
  head.rotation.z = mood==='sleep' ? .12 : Math.sin(beat*Math.PI)*(mood==='love' ? .14 : .07);

  // face
  const blinking = (t%3.6) < .12;
  const lidTarget = mood==='sleep' || blinking ? -.01 : mood==='love' ? .2 : mood==='angry' ? .07 : .1;
  eyes.forEach(e=>{
    e.lidY += (lidTarget - e.lidY)*Math.min(dt*18,1);
    e.lid.position.y = e.lidY; e.lash.position.y = e.lidY - .125;
    e.g.visible = mood !== 'love';
    const raise = mood==='love' ? .06 : mood==='angry' ? -.04 : (e.s===1 ? .05 : 0);
    const tilt = mood==='angry' ? -e.s*.45 : mood==='love' ? e.s*.25 : (e.s===1 ? -.18 : .05);
    e.brow.position.y += (.22 + raise - e.brow.position.y)*k; e.brow.rotation.z += (tilt - e.brow.rotation.z)*k;
  });
  heartL.visible = heartR.visible = mood==='love';
  if (mood==='love'){ const hs = .36 + Math.pow(1-bp,3)*.12; heartL.scale.setScalar(hs); heartR.scale.setScalar(hs); }
  grin.visible = mood==='love'; smirk.visible = !grin.visible;
  smirk.rotation.z = mood==='angry' ? .35 : Math.PI+.35;
  zzz.visible = mood==='sleep'; if (zzz.visible){ zzz.position.y = .75 + (t*.4%1)*.3; zzz.material.opacity = 1 - (t*.4%1)*.6; }
  anger.visible = mood==='angry'; if (anger.visible) anger.scale.setScalar(.42 + Math.abs(Math.sin(t*14))*.1);

  renderer.render(scene, camera);
  window.__frames=(window.__frames||0)+1;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
<script>
  setTimeout(()=>{ if(!document.querySelector('canvas')) document.getElementById('err').style.display='flex'; }, 8000);
</script>
</body>
