<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="dt-version" content="20261114140902">
<script>/* always show the newest published version (GitHub Pages caches pages ~10 min) */
(function(){var V="20261114140902";if(V.indexOf("__")===0)return;
fetch("../version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){
if(!j||!j.v||j.v===V)return;var k="dt-r-"+j.v+location.pathname;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,"1")}catch(e){}
var u=new URL(location.href);u.searchParams.set("v",j.v);location.replace(u.href)}).catch(function(){})})();</script>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Democratic Taste — Releases (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css?v=20261114140902">
<style>
  /* C = hero from B (newest release) + index list from A (sticky big cover) */
  

  /* ---------- hero: newest release (from B) ---------- */
  .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:center;padding:22px 0 56px;border-bottom:1px solid var(--line)}
  .hero .cv{position:relative}
  .hero .cv::before{content:"";position:absolute;inset:10%;border-radius:50%;background:var(--c);filter:blur(80px);opacity:.4}
  .hero img{position:relative;width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px}
  .hero .tag{font-family:var(--mono);font-size:12px;color:var(--mute);display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:.06em}
  .hero .tag b{background:var(--c);color:#0a0a0b;padding:4px 9px;border-radius:99px;font-weight:700}
  .hero h2{margin:18px 0 8px;font-size:clamp(44px,7vw,112px);line-height:.85;letter-spacing:-.04em;text-transform:uppercase}
  .hero .artist{font-size:clamp(18px,2vw,26px);color:#bdb9c1;margin-bottom:8px}
  .hero .credit{font-family:var(--mono);font-size:11px;color:var(--mute);margin-bottom:28px}
  .hero .down{display:inline-flex;margin-left:14px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-decoration:none}
  .hero .down:hover{color:var(--fg)}

  /* ---------- catalogue: index + sticky cover (from A) ---------- */
  .catalog{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 56px;scroll-margin-top:80px;padding-bottom:60px}
  li{scroll-margin-top:90px}
  .cat-head{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:48px 0 26px}
  .catalog h1{margin:0;font-size:clamp(48px,8vw,120px);line-height:.82;letter-spacing:-.04em;font-weight:700;text-transform:uppercase;display:flex;align-items:flex-start;gap:14px}
  .catalog h1 sup{font-family:var(--mono);font-size:14px;letter-spacing:0;font-weight:400;color:var(--mute);margin-top:.5em}

  .view{display:flex;font-family:var(--mono);font-size:11px;text-transform:uppercase;border:1px solid var(--dim);border-radius:99px;padding:3px}
  .view button{all:unset;cursor:pointer;padding:7px 14px;border-radius:99px;color:var(--mute);letter-spacing:.06em}
  .view button.on{background:var(--fg);color:var(--bg)}

  /* grid view (from B) */
  .grid{grid-column:1/-1;display:none;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:40px 22px}
  body.as-grid .grid{display:grid}
  body.as-grid ol,body.as-grid aside{display:none}
  .card{display:block;text-decoration:none;--c:#fff;scroll-margin-top:100px}
  .card .cv{aspect-ratio:1;border-radius:4px;overflow:hidden;transition:transform .25s,box-shadow .25s}
  .card img{width:100%;height:100%;object-fit:cover}
  .card:hover .cv,.card.on .cv{transform:translateY(-6px);box-shadow:0 26px 60px -18px var(--c)}
  .card .cap{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:center}
  .card .cat{font-family:var(--mono);font-size:11px;color:var(--mute)}
  .card .candy{justify-self:end;transition:transform .3s}
  .card:hover .candy{transform:rotate(-18deg) scale(1.3)}
  .card .t{grid-column:1/-1;font-weight:700;text-transform:uppercase;font-size:15px;line-height:1.1}
  .card .a{grid-column:1/-1;font-size:14px;color:#a9a5ad}

  ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li{border-bottom:1px solid var(--line)}
  .row{display:grid;grid-template-columns:62px 30px minmax(0,1fr) auto;align-items:center;gap:14px;padding:15px 6px;cursor:pointer;color:#6c6870;transition:color .2s,padding .2s;text-decoration:none}
  .row .cat{font-family:var(--mono);font-size:12px}
  .row .who{font-weight:700;text-transform:uppercase;font-size:clamp(16px,1.6vw,22px);line-height:1.05;letter-spacing:-.01em}
  .row .who span{display:block;font-weight:400;font-size:.78em;margin-top:3px;letter-spacing:0}
  .row .art{font-family:var(--mono);font-size:10.5px;text-align:right;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .candy{transition:transform .25s;opacity:.5}
  .row:hover{color:#bdb9c1}
  li.on .row{color:var(--fg);padding-left:14px}
  li.on .row .candy{opacity:1;transform:scale(1.25) rotate(-12deg)}
  li.on .row .art{color:var(--mute)}
  .row .thumb{display:none}

  aside{position:sticky;top:96px;align-self:start;height:calc(100vh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .stage{position:relative;width:min(100%,calc(100vh - 330px),620px);aspect-ratio:1}
  .glow{position:absolute;inset:8%;border-radius:50%;background:var(--c);filter:blur(70px);opacity:.38;transition:background .5s}
  .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:4px;transition:opacity .35s}
  .meta{margin-top:26px}
  .meta .cat{font-family:var(--mono);font-size:12px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:10px}
  .meta h2{margin:8px 0 2px;font-size:clamp(22px,2.4vw,34px);line-height:1;text-transform:uppercase;letter-spacing:-.01em}
  .meta .artist{font-size:17px;color:#bdb9c1}
  .meta .credit{font-family:var(--mono);font-size:11px;color:var(--mute);margin:10px 0 20px}

  /* ---------- phone ---------- */
  @media (max-width:820px){
    .hero{grid-template-columns:1fr;gap:24px;padding:12px 0 40px}
    .hero .down{display:none}
    .catalog{grid-template-columns:1fr}
    .cat-head{margin:34px 0 18px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 12px}
    .card .t{font-size:13px}.card .a{font-size:12px}
    aside{display:none}
    .row{grid-template-columns:52px minmax(0,1fr) 26px;gap:12px;padding:12px 0;color:var(--fg)}
    .row .cat,.row .art{display:none}
    .row .thumb{display:block;width:52px;height:52px;border-radius:3px;object-fit:cover}
    .row .candy{order:3;opacity:1}
    .row .who{font-size:16px}
    li.on .row{padding-left:0}
    .open{display:none;padding:4px 0 22px}
    li.on .open{display:block}
    .open img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;box-shadow:0 20px 70px -20px var(--c)}
    .open .credit{font-family:var(--mono);font-size:11px;color:var(--mute);margin:12px 0 14px}
  }
  @media (min-width:821px){ .open{display:none} }
</style>
</head>
<body>
<div id="hdr"></div>
<main>
  <section class="hero" id="hero"></section>

  <section class="catalog" id="catalogo">
    <div class="cat-head">
      <h1>Catálogo <sup id="count"></sup></h1>
      <div class="view" id="view"><button data-v="grid">Grid</button><button data-v="list">Lista</button></div>
    </div>
    <div class="grid" id="grid"></div>
    <ol id="list"></ol>
    <aside id="aside">
      <div class="stage"><div class="glow"></div><img id="imgA" alt=""><img id="imgB" alt="" style="opacity:0"></div>
      <div class="meta">
        <div class="cat" id="mCat"></div>
        <h2 id="mTitle"></h2>
        <div class="artist" id="mArtist"></div>
        <div class="credit" id="mCredit"></div>
        <a class="listen" id="mListen" target="_blank" rel="noopener">Escuchar ▸</a>
      </div>
    </aside>
  </section>
</main>
<div id="ftr"></div>

<script src="releases-data.js?v=20261114140902"></script>
<script src="common.js?v=20261114140902"></script>
<script>
const {R, esc, candy} = DT;
DT.mount('releases.html');
const rest = R.slice(1);
document.getElementById('count').textContent = `(${rest.length})`;

// ---- hero = newest release ----
const h = R[0];
const hero = document.getElementById('hero');
hero.style.setProperty('--c', h.color);
hero.style.scrollMarginTop = '90px';
hero.innerHTML = `
  <div class="cv"><img src="${h.img}" alt="${esc(h.title)} — ${esc(h.artist)}"></div>
  <div>
    <div class="tag"><b>Nuevo</b> ${h.cat} ${candy(h.color)}</div>
    <h2>${esc(h.title)}</h2>
    <div class="artist">${esc(h.artist)}</div>
    <div class="credit">Arte ${esc(h.art)}</div>
    <a class="listen" style="--c:${h.color}" href="${h.link}" target="_blank" rel="noopener">Escuchar ▸</a>
    <a class="down" href="#catalogo">Todo el catálogo ↓</a>
  </div>`;

// ---- catalogue list ----
const list = document.getElementById('list');
list.innerHTML = rest.map((r,i) => `
  <li id="l-${r.cat}" data-i="${i}" style="--c:${r.color}">
    <a class="row" href="${r.link}" target="_blank" rel="noopener">
      <img class="thumb" src="${r.img}" alt="" loading="lazy">
      <span class="cat">${r.cat}</span>
      ${candy(r.color)}
      <span class="who">${esc(r.artist)}<span>${esc(r.title)}</span></span>
      <span class="art">${esc(r.art)}</span>
    </a>
    <div class="open">
      <img src="${r.img}" alt="${esc(r.title)} — ${esc(r.artist)}" loading="lazy">
      <div class="credit">${r.cat} · arte ${esc(r.art)}</div>
      <a class="listen" href="${r.link}" target="_blank" rel="noopener">Escuchar ▸</a>
    </div>
  </li>`).join('');

const items = [...list.children];
const aside = document.getElementById('aside');
const A = document.getElementById('imgA'), B = document.getElementById('imgB');
let front = A, cur = -1;
rest.forEach(r => { const im = new Image(); im.src = r.img; });

function show(i){
  if (i === cur) return; cur = i;
  const r = rest[i];
  items.forEach((li,k) => li.classList.toggle('on', k === i));
  aside.style.setProperty('--c', r.color);
  const back = front === A ? B : A;
  back.src = r.img; back.alt = `${r.title} — ${r.artist}`;
  back.style.opacity = 1; front.style.opacity = 0; front = back;
  document.getElementById('mCat').innerHTML = `${candy(r.color)} ${r.cat}`;
  document.getElementById('mTitle').textContent = r.title;
  document.getElementById('mArtist').textContent = r.artist;
  document.getElementById('mCredit').textContent = 'Arte ' + r.art;
  document.getElementById('mListen').href = r.link;
}

const desktop = matchMedia('(min-width:821px)');
let hovering = false;
items.forEach((li,i) => {
  li.addEventListener('mouseenter', () => { if (desktop.matches){ hovering = true; show(i); } });
  li.addEventListener('mouseleave', () => { hovering = false; });
  li.querySelector('.row').addEventListener('click', e => {
    if (!desktop.matches){ e.preventDefault(); const was = li.classList.contains('on'); items.forEach(x => x.classList.remove('on')); if (!was){ li.classList.add('on'); cur = i; li.scrollIntoView({block:'start',behavior:'smooth'}); } else cur = -1; }
  });
});

function onScroll(){
  if (!desktop.matches || hovering || document.body.classList.contains('as-grid')) return;
  const y = innerHeight * 0.42;
  let best = 0, bd = 1e9;
  items.forEach((li,i) => { const b = li.getBoundingClientRect(); const d = Math.abs(b.top + b.height/2 - y); if (d < bd){ bd = d; best = i; } });
  show(best);
}
addEventListener('scroll', onScroll, {passive:true});
// ---- grid ----
document.getElementById('grid').innerHTML = rest.map(r => `
  <a class="card" id="g-${r.cat}" href="${r.link}" target="_blank" rel="noopener" style="--c:${r.color}">
    <div class="cv"><img src="${r.img}" alt="${esc(r.title)} — ${esc(r.artist)}" loading="lazy"></div>
    <div class="cap"><span class="cat">${r.cat}</span>${candy(r.color)}
      <span class="t">${esc(r.title)}</span><span class="a">${esc(r.artist)}</span></div>
  </a>`).join('');

// ---- Grid · Lista switch (remembered per visitor, shared with the minimal version) ----
const view = document.getElementById('view');
function setView(v){
  document.body.classList.toggle('as-grid', v === 'grid');
  view.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'list' && desktop.matches && cur < 0) show(0);
  try { localStorage.setItem('dt-view', v); } catch {}
}
view.onclick = e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); };
let saved = 'list'; try { saved = localStorage.getItem('dt-view') || 'list'; } catch {}
setView(saved);

// ---- deep link: releases.html#DT034 (from home / artists) ----
if (location.hash){
  const cat = location.hash.slice(1);
  const grid = document.body.classList.contains('as-grid');
  const el = cat === h.cat ? hero : document.getElementById((grid ? 'g-' : 'l-') + cat);
  const i = rest.findIndex(r => r.cat === cat);
  if (el) setTimeout(() => {
    el.scrollIntoView({block: el === hero ? 'start' : (desktop.matches ? 'center' : 'start')});
    if (el !== hero){ if (!grid && desktop.matches) show(i); else { el.classList.add('on'); cur = i; } }
  }, 150);
}
</script>
</body>
</html>
