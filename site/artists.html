<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Democratic Taste — Artists (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:22px 0 30px}
  .intro p{max-width:420px;margin:0;color:#a9a5ad;line-height:1.55}
  .az{display:flex;flex-wrap:wrap;gap:4px;padding:0 0 26px;font-family:var(--mono);font-size:12px}
  .az a{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--dim);border-radius:6px;text-decoration:none;color:#bdb9c1}
  .az a:hover{border-color:var(--mute);color:var(--fg)}

  .letter{font-family:var(--mono);font-size:12px;color:var(--mute);padding:26px 0 10px;scroll-margin-top:90px}
  ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li{border-bottom:1px solid var(--line);scroll-margin-top:90px}
  .art{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;padding:16px 4px;cursor:pointer}
  .art h3{margin:0;font-size:clamp(26px,4vw,58px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase;color:#6c6870;transition:color .2s;display:flex;align-items:center;gap:14px}
  .art h3 sup{font-family:var(--mono);font-size:12px;letter-spacing:0;font-weight:400;color:var(--mute)}
  .art .candy{width:34px;height:17px;opacity:.5;transition:transform .25s,opacity .2s}
  .strip{display:flex;gap:8px}
  .strip a{display:block;width:64px;height:64px;border-radius:3px;overflow:hidden;opacity:.35;filter:grayscale(1);transition:opacity .25s,filter .25s,transform .25s}
  .strip img{width:100%;height:100%;object-fit:cover}
  li:hover h3,li.on h3{color:var(--fg)}
  li:hover .candy,li.on .candy{opacity:1;transform:rotate(-14deg) scale(1.2)}
  li:hover .strip a,li.on .strip a{opacity:1;filter:none}
  .strip a:hover{transform:translateY(-4px)}

  @media (max-width:820px){
    .art{grid-template-columns:1fr;gap:12px;padding:16px 0}
    .art h3{color:var(--fg);font-size:28px}
    .art .candy{opacity:1}
    .strip{overflow-x:auto;scrollbar-width:none}
    .strip a{opacity:1;filter:none;width:58px;height:58px;flex:none}
  }
</style>
</head>
<body>
<div id="hdr"></div>
<main>
  <div class="intro">
    <h1 class="big">Artists <sup id="count"></sup></h1>
    <p>Un trampolín para artistas nuevos y un patio de juegos para los consolidados. Cada portada lleva el color de su caramelo.</p>
  </div>
  <nav class="az" id="az"></nav>
  <div id="list"></div>
</main>
<div id="ftr"></div>

<script src="releases-data.js"></script>
<script src="common.js"></script>
<script>
const {R, esc, candy, artists, byArtist, slug} = DT;
DT.mount('artists.html');
document.getElementById('count').textContent = `(${artists.length})`;

const first = a => a.normalize('NFD')[0].toUpperCase().replace(/[^A-Z]/, '#');
const groups = {};
artists.forEach(a => (groups[first(a)] = groups[first(a)] || []).push(a));
const letters = Object.keys(groups).sort();

document.getElementById('az').innerHTML = letters.map(l => `<a href="#letra-${l}">${l}</a>`).join('');
document.getElementById('list').innerHTML = letters.map(l => `
  <div class="letter" id="letra-${l}">${l}</div>
  <ul>${groups[l].map(a => { const rel = byArtist[a]; const c = R[rel[0]].color; return `
    <li id="${slug(a)}" style="--c:${c}">
      <div class="art">
        <h3>${candy(c)}${esc(a)}<sup>${rel.length > 1 ? `(${rel.length})` : ''}</sup></h3>
        <div class="strip">${rel.map(i => `<a href="releases.html#${R[i].cat}" title="${R[i].cat} — ${esc(R[i].title)}"><img src="${R[i].img}" alt="${esc(R[i].title)}" loading="lazy"></a>`).join('')}</div>
      </div>
    </li>`; }).join('')}</ul>`).join('');

// arriving from the home marquee: highlight that artist
if (location.hash){
  const li = document.getElementById(location.hash.slice(1));
  if (li && li.tagName === 'LI'){ li.classList.add('on'); setTimeout(() => li.scrollIntoView({block:'center'}), 150); }
}
</script>
</body>
</html>
