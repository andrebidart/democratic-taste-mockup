<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Democratic Taste — Releases (minimal mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* newest release: cover + quiet text */
  .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:end;padding:40px 0 0}
  .hero img{width:100%;aspect-ratio:1;object-fit:cover}
  .hero h1{font-size:clamp(28px,3.4vw,44px);line-height:1.05;margin:14px 0 6px}
  .hero .artist{color:var(--mute);font-size:17px;margin-bottom:28px}

  /* catalogue: list left, sticky cover right */
  .catalog{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);scroll-margin-top:80px}
  ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li{border-bottom:1px solid var(--line);scroll-margin-top:90px}
  .row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:13px 0;color:var(--mute);transition:color .2s}
  .row .who{font-size:15px}
  .row .who span{color:inherit;opacity:.7}
  .row .candy{opacity:0;transition:opacity .2s}
  li.on .row{color:var(--fg)}
  li.on .row .candy{opacity:1}
  .row .thumb{display:none}

  aside{position:sticky;top:90px;align-self:start}
  aside img{width:100%;aspect-ratio:1;object-fit:cover}
  aside .meta{display:flex;justify-content:space-between;gap:16px;align-items:baseline;margin-top:16px}
  aside .t{font-size:15px}
  aside .a{color:var(--mute);font-size:14px;margin-top:2px}

  @media (max-width:820px){
    .hero,.catalog{grid-template-columns:1fr}
    aside{display:none}
    .row{grid-template-columns:44px minmax(0,1fr);color:var(--fg);align-items:center}
    .row .thumb{display:block;width:44px;height:44px;object-fit:cover}
    .row .cat,.row .candy{display:none}
    .open{display:none;padding:6px 0 22px}
    li.on .open{display:block}
    .open img{width:100%;aspect-ratio:1;object-fit:cover;margin-bottom:14px}
  }
  @media (min-width:821px){ .open{display:none} }
</style>
</head>
<body>
<div id="hdr"></div>
<main>
  <section class="hero" id="hero"></section>
  <section class="sec catalog" id="catalogo">
    <div>
      <div class="sec-head"><h2 class="mono">Catálogo</h2><span class="mono mute" id="count"></span></div>
      <ol id="list"></ol>
    </div>
    <aside id="aside">
      <img id="aImg" alt="">
      <div class="meta"><div><div class="t" id="aT"></div><div class="a" id="aA"></div></div><a class="link" id="aL" target="_blank" rel="noopener">Escuchar →</a></div>
    </aside>
  </section>
</main>
<div id="ftr"></div>
<script src="releases-data.js"></script>
<script src="common.js"></script>
<script>
const {R, esc, candy} = DT;
DT.mount('releases.html');
document.getElementById('count').textContent = R.length;

const h = R[0];
document.getElementById('hero').innerHTML = `
  <img src="${h.img}" alt="${esc(h.title)} — ${esc(h.artist)}">
  <div><span class="mono mute">${h.cat} · nuevo</span> ${candy(h.color)}
    <h1>${esc(h.title)}</h1><div class="artist">${esc(h.artist)}</div>
    <a class="link" style="--c:${h.color}" href="${h.link}" target="_blank" rel="noopener">Escuchar →</a></div>`;

const list = document.getElementById('list');
list.innerHTML = R.map((r,i) => `
  <li id="${r.cat}">
    <a class="row" href="${r.link}" target="_blank" rel="noopener">
      <img class="thumb" src="${r.img}" alt="" loading="lazy">
      <span class="cat mono">${r.cat}</span>
      <span class="who">${esc(r.artist)} — <span>${esc(r.title)}</span></span>
      ${candy(r.color)}
    </a>
    <div class="open"><img src="${r.img}" alt="${esc(r.title)}" loading="lazy"><a class="link" href="${r.link}" target="_blank" rel="noopener">Escuchar →</a></div>
  </li>`).join('');

const items = [...list.children];
const desktop = matchMedia('(min-width:821px)');
let cur = -1, hovering = false;
R.forEach(r => { new Image().src = r.img; });
function show(i){
  if (i === cur) return; cur = i; const r = R[i];
  items.forEach((li,k) => li.classList.toggle('on', k === i));
  document.getElementById('aImg').src = r.img;
  document.getElementById('aT').textContent = r.title;
  document.getElementById('aA').textContent = r.artist + ' · ' + r.cat;
  const l = document.getElementById('aL'); l.href = r.link; l.style.setProperty('--c', r.color);
}
items.forEach((li,i) => {
  li.addEventListener('mouseenter', () => { if (desktop.matches){ hovering = true; show(i); } });
  li.addEventListener('mouseleave', () => { hovering = false; });
  li.querySelector('.row').addEventListener('click', e => {
    if (desktop.matches) return;
    e.preventDefault(); const was = li.classList.contains('on');
    items.forEach(x => x.classList.remove('on')); if (!was) li.classList.add('on');
  });
});
addEventListener('scroll', () => {
  if (!desktop.matches || hovering) return;
  const y = innerHeight * .42; let best = 0, bd = 1e9;
  items.forEach((li,i) => { const b = li.getBoundingClientRect(); const d = Math.abs(b.top + b.height/2 - y); if (d < bd){ bd = d; best = i; } });
  show(best);
}, {passive:true});
const target = location.hash ? items.findIndex(li => '#' + li.id === location.hash) : -1;
if (target > -1) setTimeout(() => { items[target].scrollIntoView({block:'center'}); if (desktop.matches) show(target); else items[target].classList.add('on'); }, 150);
else if (desktop.matches) show(0);
</script>
</body>
</html>
